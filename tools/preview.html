<!doctype html>
<!-- Offline preview for nearby-card.js.

     Home Assistant is not here, so this page stubs the few pieces of it the
     card touches — <ha-card>, <ha-icon>, and <hui-card>, which stands in for
     whatever card you nest — and feeds the card a fake `hass` with a small
     made-up house: two floors, five areas, a handful of entities.

     What it proves: the grouping, the order, the header, the room chips, and
     that each presence source wins when it should. What it cannot prove: how
     the nested cards actually look, since those are real Home Assistant
     components. Check that in Home Assistant.

     Run it:

       open tools/preview.html

     or, for a screenshot:

       /Applications/Google\ Chrome.app/Contents/MacOS/Google\ Chrome \
         --headless=new --disable-gpu --allow-file-access-from-files \
         --virtual-time-budget=3000 --window-size=1500,1000 \
         --screenshot=/tmp/preview.png "file://$PWD/tools/preview.html"
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Nearby Card — offline preview</title>
<style>
  :root {
    --primary-text-color:#212121; --secondary-text-color:#727272;
    --divider-color:rgba(0,0,0,.12); --primary-color:#03a9f4;
    --card-background-color:#fff; --secondary-background-color:#eef0f2;
    --text-primary-color:#fff; --disabled-text-color:#bdbdbd;
    font-family:Roboto,system-ui,sans-serif;
  }
  body { margin:0; padding:14px; background:#fafafa; display:flex; flex-wrap:wrap;
         gap:14px; align-items:flex-start; }
  .case { width:330px; }
  /* the card has no background of its own now: this frame stands in for the
     dashboard section it would sit in */
  .frame { background:rgba(0,0,0,.04); border-radius:12px; padding:8px; }
  h3 { font:600 13px/1.35 system-ui; color:#555; margin:0 0 6px; }
  .expect { font:400 11.5px/1.35 system-ui; color:#888; margin:0 0 6px; }
  .verdict { font:600 12px/1.4 system-ui; margin:6px 0 0; }
  .ok { color:#2e7d32; } .ko { color:#c62828; }
</style>
</head>
<body>
<pre id="results" style="width:100%;font:12px/1.5 ui-monospace,monospace;color:#333">RESULTS\n(script did not finish)</pre>
<script>
  window.onerror = (msg, src, line, col) => {
    const p = document.getElementById("results");
    if (p) p.textContent += `\nJS ERROR ${msg} @${(src||"").split("/").pop()}:${line}:${col}`;
  };
  /* ---- stubs of the Home Assistant components the card touches ---------- */
  customElements.define("ha-card", class extends HTMLElement {
    connectedCallback() {
      this.style.cssText = "display:block;background:var(--card-background-color);" +
        "border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.16)";
    }
  });
  customElements.define("ha-icon", class extends HTMLElement {
    connectedCallback() {
      this.style.cssText = "display:inline-block;width:26px;height:26px;" +
        "border-radius:50%;background:currentColor;opacity:.8";
    }
  });
  /* Stand-in for a nested card: shows what it was given, nothing more. */
  customElements.define("hui-card", class extends HTMLElement {
    set config(c) { this._c = c; this._draw(); }
    set hass(h) { this._h = h; this._draw(); }
    set preview(v) { this._p = v; }
    load() { this._loaded = true; this._draw(); }
    getCardSize() { return 1; }
    _draw() {
      if (!this._c || !this._h) return;
      if (this._c.type === "heading") {
        const big = this._c.heading_style === "title";
        this.style.cssText = "display:block;padding:6px 2px 2px";
        this.innerHTML =
          '<div style="display:flex;align-items:center;gap:6px;font:' +
          (big ? "600 15px" : "500 13px") + '/1.3 system-ui;color:var(--' +
          (big ? "primary" : "secondary") + '-text-color)">' +
          (this._c.icon ? '<span data-icon="' + this._c.icon +
            '" style="width:16px;height:16px;border-radius:3px;background:currentColor;opacity:.5"></span>' : '') +
          '<span>' + this._c.heading + '</span></div>';
        return;
      }
      const id = this._c.entity || "(no entity)";
      const s = this._h.states[id];
      const name = this._c.name || (s && s.attributes.friendly_name) || id;
      this.style.cssText = "display:block;background:var(--card-background-color);" +
        "border:1px solid var(--divider-color);border-radius:11px;padding:7px 10px";
      this.innerHTML =
        '<div style="display:flex;gap:8px;align-items:center">' +
        '<span style="width:22px;height:22px;border-radius:50%;flex:none;background:' +
        (s && s.state === "on" ? "var(--primary-color)" : "#9aa0a6") + ';opacity:.3"></span>' +
        '<div style="min-width:0"><div style="font-size:13px">' + name + '</div>' +
        '<div style="font-size:11px;color:var(--secondary-text-color)">' + id + '</div>' +
        '</div></div>';
    }
  });
  window.loadCardHelpers = async () => ({ createCardElement: () => document.createElement("div") });

  /* Stubs for the editor's children. ha-form is deliberately built to be
     nasty: it announces value-changed every time someone assigns .data, the
     way the real one does when it fills in a schema default. That is what
     froze a browser tab once, so the editor has to survive it here. */
  customElements.define("ha-form", class extends HTMLElement {
    set data(v) {
      this._data = v;
      this.dispatchEvent(new CustomEvent("value-changed", {
        detail: { value: v }, bubbles: true, composed: true,
      }));
    }
    get data() { return this._data; }
    set schema(v) { this._schema = v; }
    set hass(v) { this._hass = v; }
  });
  /* Home Assistant's stack editor, which this card borrows whole. The stub
     re-announces whatever it is handed, like the real one, and forwards the
     events of the cards being edited inside it — the two things the card has
     to tell apart. */
  customElements.define("stub-stack-editor", class extends HTMLElement {
    setConfig(c) {
      this._c = c;
      this.dispatchEvent(new CustomEvent("config-changed", {
        detail: { config: c }, bubbles: true, composed: true,
      }));
    }
    set hass(v) { this._hass = v; }
    set lovelace(v) { this._lovelace = v; }
  });
  customElements.define("hui-vertical-stack-card", class extends HTMLElement {
    static async getConfigElement() { return document.createElement("stub-stack-editor"); }
    setConfig() {}
    set hass(v) {}
  });
  customElements.define("ha-icon-button", class extends HTMLElement {});
</script>
<script src="../nearby-card.js"></script>
<script>
  /* ---- a small made-up house ------------------------------------------- */
  const FLOORS = {
    ground: { floor_id: "ground", name: "Ground floor", level: 0 },
    upstairs: { floor_id: "upstairs", name: "Upstairs", level: 1 },
  };
  const AREAS = {
    kitchen:  { area_id: "kitchen",  name: "Kitchen",  floor_id: "ground" },
    living:   { area_id: "living",   name: "Living room", floor_id: "ground" },
    bathroom: { area_id: "bathroom", name: "Bathroom", floor_id: "ground" },
    bedroom:  { area_id: "bedroom",  name: "Bedroom",  floor_id: "upstairs" },
    study:    { area_id: "study",    name: "Study",    floor_id: "upstairs" },
  };
  /* entity -> area, plus a friendly name and a state */
  const ENTITIES = {
    "light.kitchen":        ["kitchen",  "Kitchen light", "on"],
    "cover.kitchen_blind":  ["kitchen",  "Kitchen blind", "open"],
    "switch.coffee":        ["kitchen",  "Coffee machine", "off"],
    "light.living":         ["living",   "Living room light", "on"],
    "cover.back_window":    ["living",   "Back window", "open"],
    "media_player.tv":      ["living",   "TV", "off"],
    "light.bathroom":       ["bathroom", "Bathroom light", "off"],
    "light.bedroom":        ["bedroom",  "Bedroom light", "off"],
    "cover.bedroom_blind":  ["bedroom",  "Bedroom blind", "closed"],
    "light.study":          ["study",    "Study light", "off"],
  };

  const states = {}, entities = {};
  for (const [id, [area, name, state]] of Object.entries(ENTITIES)) {
    states[id] = { entity_id: id, state, attributes: { friendly_name: name } };
    entities[id] = { entity_id: id, area_id: area, device_id: null };
  }
  const now = new Date();
  const ago = (min) => new Date(now.getTime() - min * 60000).toISOString();

  /* presence entities the cases play with */
  Object.assign(states, {
    "sensor.phone_area": { entity_id: "sensor.phone_area", state: "Living room",
      attributes: { friendly_name: "Phone area", area_id: "living", floor_id: "ground" } },
    "sensor.phone_distance": { entity_id: "sensor.phone_distance", state: "0.9",
      attributes: { friendly_name: "Phone distance", device_class: "distance", unit_of_measurement: "m" } },
    "binary_sensor.bathroom_presence": { entity_id: "binary_sensor.bathroom_presence", state: "off",
      last_changed: ago(90), attributes: { friendly_name: "Bathroom presence" } },
    "binary_sensor.study_presence": { entity_id: "binary_sensor.study_presence", state: "off",
      last_changed: ago(90), attributes: { friendly_name: "Study presence" } },
  });

  const baseHass = () => ({
    states: JSON.parse(JSON.stringify(states)),
    entities, areas: AREAS, floors: FLOORS,
    callService: (d, s, o) => console.log("callService", d, s, o),
  });

  const CARDS = Object.keys(ENTITIES).map((entity) => ({ type: "tile", entity }));

  const BASE_CONFIG = {
    type: "custom:nearby-card",
    cards: CARDS,
    presence: {
      area_sensor: {
        entity: "sensor.phone_area",
        distance_entity: "sensor.phone_distance",
        max_distance: 3.5,
      },
      area_sensors: [
        { area: "bathroom", entity: "binary_sensor.bathroom_presence" },
        { area: "study", entity: "binary_sensor.study_presence" },
      ],
      priority: ["area_sensors", "area_sensor"],
    },
    nearby: [{ area: "bathroom", entities: ["cover.back_window"] }],
  };

  /* ---- the cases -------------------------------------------------------- */
  const CASES = [
    {
      title: "1. Area sensor: living room, close by",
      hero: "In the living room",
      expect: "Living room first, then rest of ground floor, then upstairs",
      config: BASE_CONFIG,
      hass: (h) => h,
      check: (card) => firstGroup(card) === "Living room",
    },
    {
      title: "2. Same, but 6.3 m away",
      expect: "Room dropped, ground floor kept, note says why",
      config: BASE_CONFIG,
      hass: (h) => { h.states["sensor.phone_distance"].state = "6.3"; return h; },
      check: (card) => firstGroup(card) === "Ground floor" && note(card).includes("6.3"),
    },
    {
      title: "3. Room sensor wins over the area sensor",
      hero: "In the bathroom — with the window lent to it",
      expect: "Bathroom first, and the lent back window with it",
      config: BASE_CONFIG,
      hass: (h) => {
        h.states["binary_sensor.bathroom_presence"].state = "on";
        h.states["binary_sensor.bathroom_presence"].last_changed = ago(1);
        return h;
      },
      check: (card) => firstGroup(card) === "Bathroom" && groupEntities(card, 0).includes("cover.back_window"),
    },
    {
      title: "4. Two room sensors on: newest wins",
      expect: "Study, triggered a minute ago, beats the bathroom from an hour ago",
      config: BASE_CONFIG,
      hass: (h) => {
        h.states["binary_sensor.bathroom_presence"].state = "on";
        h.states["binary_sensor.bathroom_presence"].last_changed = ago(60);
        h.states["binary_sensor.study_presence"].state = "on";
        h.states["binary_sensor.study_presence"].last_changed = ago(1);
        return h;
      },
      check: (card) => firstGroup(card) === "Study",
    },
    {
      title: "5. Nothing knows where you are",
      expect: "No reordering: grouped by floor, ground floor first",
      config: BASE_CONFIG,
      hass: (h) => {
        h.states["sensor.phone_area"].state = "unknown";
        h.states["sensor.phone_area"].attributes = { friendly_name: "Phone area" };
        return h;
      },
      check: (card) => firstGroup(card) === "Ground floor" && title(card) === "Away",
    },
    {
      title: "6. Header at the bottom, sorted by name",
      expect: "Same grouping, position line last, names alphabetical",
      config: { ...BASE_CONFIG, sort: "name", header: { position: "bottom", allow_manual: true } },
      hass: (h) => h,
      check: (card) => {
        const names = groupEntities(card, 0);
        return names.join() === [...names].sort().join() ? true : "order: " + names.join(" ");
      },
    },
    {
      title: "7. Room said by hand, chips open",
      hero: "Room said by hand",
      expect: "Bedroom first even though the sensors say living room",
      config: BASE_CONFIG,
      hass: (h) => h,
      manual: "bedroom",
      openChips: true,
      check: (card) => firstGroup(card) === "Bedroom",
    },
    {
      title: "8b. Grouped by floor, yours first",
      hero: "Grouped by floor",
      expect: "Ground floor on top because you are on it, then upstairs",
      config: { ...BASE_CONFIG, grouping: "floor" },
      hass: (h) => h,
      check: (card) => {
        const caps = captions(card);
        if (caps.join() !== "Ground floor,Upstairs") return "headings: " + caps.join(" / ");
        /* the group you are in is the one drawn as a title, the others as subtitles */
        const styles = headings(card).map((el) => el._c.heading_style);
        return styles.join() === "title,subtitle" ? true : "styles: " + styles.join(" / ");
      },
    },
    {
      title: "8c. By floor, but you are upstairs",
      expect: "Upstairs jumps above the ground floor",
      config: { ...BASE_CONFIG, grouping: "floor" },
      hass: (h) => {
        h.states["binary_sensor.study_presence"].state = "on";
        h.states["binary_sensor.study_presence"].last_changed = ago(1);
        return h;
      },
      check: (card) => {
        const caps = captions(card);
        return caps.join() === "Upstairs,Ground floor" ? true : "headings: " + caps.join(" / ");
      },
    },
    {
      title: "8d. Icons beside the headings",
      hero: "Icons beside the headings",
      expect: "Area icon on the room, storey number on the floors",
      config: { ...BASE_CONFIG, group_icons: true },
      hass: (h) => h,
      check: (card) => {
        const icons = headings(card).map((el) => el._c.icon ?? null);
        /* no area or floor in the fake house sets an icon of its own, so
           these are the fallbacks: an area looks like an area, a floor like
           its storey */
        /* room, then floor, then "Elsewhere", which is not a place and so
           carries no icon */
        const want = ["mdi:texture-box", "mdi:home-floor-0", null];
        return icons.join("|") === want.join("|") ? true : "icons: " + icons.join(" / ");
      },
    },
    {
      title: "8e. By floor, room you are in first",
      expect: "Bedroom cards jump to the top of the Upstairs group",
      config: { ...BASE_CONFIG, grouping: "floor", sort: "nearby" },
      hass: (h) => {
        /* upstairs, in the bedroom: the floor decides the group, the room
           decides the order inside it */
        h.states["sensor.phone_area"].state = "Bedroom";
        h.states["sensor.phone_area"].attributes =
          { friendly_name: "Phone area", area_id: "bedroom", floor_id: "upstairs" };
        return h;
      },
      check: (card) => {
        const caps = captions(card);
        if (caps[0] !== "Upstairs") return "first group: " + caps[0];
        const first = groupEntities(card, 0);
        return first[0] === "light.bedroom" && first[1] === "cover.bedroom_blind"
          ? true : "order upstairs: " + first.join(" ");
      },
    },
    {
      title: "8. No grouping, position hidden",
      expect: "One flat list, no headings, no position line",
      config: { ...BASE_CONFIG, grouping: "none", header: { position: "hidden" } },
      hass: (h) => h,
      check: (card) =>
        headings(card).length === 0 &&
        card.shadowRoot.querySelector(".where").style.display === "none",
    },
  ];

  /* ---- helpers that read what the card drew ----------------------------- */
  const title = (card) => card.shadowRoot.querySelector(".line1").textContent;
  const note = (card) => card.shadowRoot.querySelector(".line2").textContent;
  const headings = (card) =>
    [...card.shadowRoot.querySelectorAll("hui-card")].filter((el) => el._c && el._c.type === "heading");
  const captions = (card) => headings(card).map((el) => el._c.heading);
  const firstGroup = (card) => captions(card)[0] ?? null;
  const groupEntities = (card, i) =>
    [...card.shadowRoot.querySelectorAll(".group")[i].querySelectorAll("hui-card")]
      .filter((el) => el._c && el._c.type !== "heading")
      .map((el) => el._c.entity);

  const results = [];

  /* ?hero=1 draws a few cases side by side without the test scaffolding, for
     the picture in the README. It is still the offline preview: the cards
     inside are stand-ins, not real Home Assistant cards. */
  const HERO = new URLSearchParams(location.search).has("hero");
  const SHOWN = HERO ? [0, 2, 6] : CASES.map((_, i) => i);

  for (const [i, c] of CASES.entries()) {
    const box = document.createElement("div");
    box.className = "case";
    box.innerHTML = HERO
      ? `<h3>${c.hero || c.title.replace(/^\d+\.\s*/, "")}</h3>`
      : `<h3>${c.title}</h3><p class="expect">${c.expect}</p>`;
    box.style.display = SHOWN.includes(i) ? "" : "none";
    document.body.appendChild(box);

    const card = document.createElement("nearby-card");
    card.setConfig(c.config);
    const frame = document.createElement("div");
    frame.className = "frame";
    frame.appendChild(card);
    box.appendChild(frame);
    if (c.manual) card._manual = { area: c.manual, until: Date.now() + 20 * 60000 };
    card.hass = c.hass(baseHass());
    if (c.openChips) card.shadowRoot.querySelector(".pick").click();

    const got = c.check(card);
    const v = document.createElement("p");
    v.className = "verdict " + (got === true ? "ok" : "ko");
    v.textContent = got === true ? "PASS" : "FAIL — " + (got || "see above");
    if (HERO) v.style.display = "none";
    box.appendChild(v);
    results.push((got === true ? "PASS" : "FAIL") + "  " + c.title +
                 (got === true ? "" : "  (" + got + ")"));
  }

  /* ---- the editor, which is where the loops hide ------------------------ */
  const editorCase = async () => {
   if (!HERO) {
    const box = document.createElement("div");
    box.className = "case";
    box.innerHTML = "<h3>9. Editor does not loop</h3>" +
      '<p class="expect">A quiet hass update changes nothing; one edit says so once</p>';
    document.body.appendChild(box);

    const ed = document.createElement("nearby-card-editor");
    let announced = 0, lastConfig = null;
    ed.addEventListener("config-changed", (e) => { announced++; lastConfig = e.detail.config; });
    box.appendChild(ed);

    const problems = [];
    ed.setConfig(JSON.parse(JSON.stringify(BASE_CONFIG)));
    ed.hass = baseHass();
    ed.lovelace = { config: {} };

    /* _boot is async: give the borrowed stack editor a turn to arrive */
    await new Promise((r) => setTimeout(r, 0));
    ed._sync();

    if (!ed.shadowRoot.querySelector("stub-stack-editor")) {
      problems.push("the stack editor was never mounted");
    }

    /* the dashboard hands hass back on every state change in the house */
    const nodesBefore = ed.shadowRoot.querySelectorAll("*").length;
    const before = announced;
    for (let i = 0; i < 50; i++) ed.hass = baseHass();
    const nodesAfter = ed.shadowRoot.querySelectorAll("*").length;
    if (announced !== before) problems.push(`${announced - before} config changes from idle hass updates`);
    if (nodesAfter !== nodesBefore) problems.push(`DOM went from ${nodesBefore} to ${nodesAfter} nodes`);

    /* a real edit through the stack editor: announced exactly once */
    announced = 0;
    const stack = ed.shadowRoot.querySelector("stub-stack-editor");
    stack.dispatchEvent(new CustomEvent("config-changed", {
      detail: { config: { type: "custom:nearby-card", cards: [{ type: "tile", entity: "light.study" }] } },
      bubbles: true, composed: true,
    }));
    if (announced !== 1) problems.push(`one card edit announced ${announced} times`);
    if (!lastConfig || lastConfig.cards.length !== 1) problems.push("the card edit did not carry through");
    if (lastConfig && !lastConfig.presence) problems.push("the rest of the config was dropped");

    /* an event from a card being edited INSIDE the stack editor is not ours:
       it has to keep travelling up, or the stack editor never sees it */
    let passedThrough = 0;
    const catcher = (e) => { if (e.detail.config.type === "tile") passedThrough++; };
    box.addEventListener("config-changed", catcher);
    stack.dispatchEvent(new CustomEvent("config-changed", {
      detail: { config: { type: "tile", entity: "light.kitchen" } },
      bubbles: true, composed: true,
    }));
    box.removeEventListener("config-changed", catcher);
    if (passedThrough !== 1) problems.push("events from the nested cards are being swallowed");

    /* the dashboard echoes the new config back, as it does */
    announced = 0;
    ed.setConfig(lastConfig);
    if (announced !== 0) problems.push(`the echo bounced back ${announced} times`);

    const v = document.createElement("p");
    v.className = "verdict " + (problems.length ? "ko" : "ok");
    v.textContent = problems.length ? "FAIL — " + problems.join("; ") : "PASS";
    box.appendChild(v);
    results.push((problems.length ? "FAIL" : "PASS") + "  9. Editor does not loop" +
                 (problems.length ? "  (" + problems.join("; ") + ")" : ""));
   }
  };

  editorCase().then(() => {

    /* Put the verdicts where a headless run can read them without a screenshot:
       `chrome --headless --dump-dom | grep -A20 RESULTS` */
    const summary = document.getElementById("results");
    summary.style.cssText = "width:100%;font:12px/1.5 ui-monospace,monospace;color:#333";
    if (HERO) summary.style.display = "none";
    summary.textContent = "RESULTS\n" + results.join("\n") +
      `\n${results.filter((r) => r.startsWith("PASS")).length}/${results.length} passed`;
    document.title = `Nearby Card — ${results.filter((r) => r.startsWith("PASS")).length}/${results.length} passed`;
  });
</script>
</body>
</html>
